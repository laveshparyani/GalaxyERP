name: Bug report
description: Something is not working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: Environment
      options:
        - WSL2 Ubuntu 24.04
        - WSL2 Ubuntu 22.04
        - WSL2 Ubuntu 20.04
        - Native Ubuntu
    validations:
      required: true
  - type: input
    id: script
    attributes:
      label: Script and step
      placeholder: e.g. startup.sh, option 1, MariaDB configuration
  - type: textarea
    id: logs
    attributes:
      label: Error message or traceback
      description: Paste the terminal output. Remove any passwords first.
      render: shell
